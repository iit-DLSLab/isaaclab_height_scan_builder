# ============================ go2_self_filter.yaml ============================
# Self filter for the MuJoCo model robot_model/go2/go2.xml, converted to URDF by
# launch/mjcf_to_urdf.py. The paddings were tuned on the collision shapes of the
# old go2_description URDF (see the git history of this file) and are mapped
# onto the MJCF shapes (see the comments per link).
#
# The converter turns each capsule into a cylinder plus two end-cap spheres on
# the same link: the cylinder uses the link cylinder_* values, the spheres the
# link padding/scale (default_sphere_* if unset).
self_filter:
  ros__parameters:
    sensor_frame: ""

    # Spheres (feet) use these defaults.
    default_sphere_scale: 1.0
    default_sphere_padding: 0.04

    # Every box/cylinder link sets both scale and padding: otherwise
    # robot_self_filter silently uses the link sphere padding.

    keep_organized: false
    zero_for_removed_points: false
    invert: false
    min_sensor_dist: 0.1

    # Link definitions. The MJCF has no calflower links: all three calf boxes
    # belong to *_calf.
    self_see_links:
      names:
        - base_link
        - FL_hip
        - FL_thigh
        - FL_calf
        - FL_foot
        - FR_hip
        - FR_thigh
        - FR_calf
        - FR_foot
        - RL_hip
        - RL_thigh
        - RL_calf
        - RL_foot
        - RR_hip
        - RR_thigh
        - RR_calf
        - RR_foot

      # The MJCF trunk box is 0.26 x 0.0935 x 0.12 (URDF: 0.3762 x 0.0935 x 0.114).
      # This padding gives it the same padded extent as the URDF box (x +-0.188,
      # y +-0.057, z +-0.177), which covers the streak of mixed pixels under the
      # belly. It also applies to the two small boxes on top and at the front.
      # The side and head capsules and the head sphere are also on base_link: they
      # stay unpadded, so the head sphere (bottom ~11 cm below the base) does not
      # cut high steps in front of the robot.
      base_link:
        box_scale: [1.0, 1.0, 1.0]
        box_padding: [0.058, 0.01, 0.117]
        cylinder_scale: [1.0, 1.0]
        cylinder_padding: [0.0, 0.0]
        padding: 0.0

      # Hips: capsules along y (radius 0.046). Same radial padding as the URDF
      # hip cylinders, also on the end caps.
      FL_hip:
        cylinder_scale: [1.0, 1.0]
        cylinder_padding: [0.05, 0.025]
        padding: 0.05
      FR_hip:
        cylinder_scale: [1.0, 1.0]
        cylinder_padding: [0.05, 0.025]
        padding: 0.05
      RL_hip:
        cylinder_scale: [1.0, 1.0]
        cylinder_padding: [0.05, 0.025]
        padding: 0.05
      RR_hip:
        cylinder_scale: [1.0, 1.0]
        cylinder_padding: [0.05, 0.025]
        padding: 0.05

      # Thighs (boxes [x, y, z]): same box as the URDF.
      FL_thigh:
        box_scale: [1.0, 1.0, 1.0]
        box_padding: [0.06, 0.06, 0.06]
      FR_thigh:
        box_scale: [1.0, 1.0, 1.0]
        box_padding: [0.06, 0.06, 0.06]
      RL_thigh:
        box_scale: [1.0, 1.0, 1.0]
        box_padding: [0.06, 0.06, 0.06]
      RR_thigh:
        box_scale: [1.0, 1.0, 1.0]
        box_padding: [0.06, 0.06, 0.06]

      # Calves: three boxes along the calf (z) instead of the URDF cylinders, so
      # the URDF [radial, vertical] = [0.09, 0.025] becomes [x, y, z] = [0.09, 0.09, 0.025].
      FL_calf:
        box_scale: [1.0, 1.0, 1.0]
        box_padding: [0.09, 0.09, 0.025]
      FR_calf:
        box_scale: [1.0, 1.0, 1.0]
        box_padding: [0.09, 0.09, 0.025]
      RL_calf:
        box_scale: [1.0, 1.0, 1.0]
        box_padding: [0.09, 0.09, 0.025]
      RR_calf:
        box_scale: [1.0, 1.0, 1.0]
        box_padding: [0.09, 0.09, 0.025]
