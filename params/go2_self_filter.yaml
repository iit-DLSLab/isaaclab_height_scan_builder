# ============================ filter_improved.yaml ============================
self_filter:
  ros__parameters:
    sensor_frame: ""

    # The Go2 collision shapes are thinner than the real legs, and the lidar adds
    # mixed pixels around their edges: the paddings below (thighs 6 cm, calves 9 cm,
    # see the per-link entries) remove ~93% of the leg points (my_bag2/9), losing
    # ~2-4% of the ground around the feet. Steps right in front of the feet (up to
    # a 17 cm riser) and under the belly are still mapped correctly.

    # For spheres (single scale & padding): feet
    default_sphere_scale: 1.0
    default_sphere_padding: 0.04

    # For boxes (x,y,z scale & padding): thighs (base_link has its own entry)
    default_box_scale: [1.0, 1.0, 1.0]
    default_box_padding: [0.06, 0.06, 0.06]

    # For cylinders (radial scale, vertical scale, radial padding, vertical padding):
    # hips (calves have their own entries). Kept small: a larger hip cylinder would
    # reach down in front of the hips and could cut high steps there.
    default_cylinder_scale: [1.0, 1.0]
    default_cylinder_padding: [0.05, 0.025]

    keep_organized: false
    zero_for_removed_points: false
    invert: false
    min_sensor_dist: 0.1

    # Link definitions
    self_see_links:
      names:
        - base_link
        - FL_hip
        - FL_thigh
        - FL_calf
        - FL_calflower
        - FL_calflower1
        - FL_foot
        - FR_hip
        - FR_thigh
        - FR_calf
        - FR_calflower
        - FR_calflower1
        - FR_foot
        - RL_hip
        - RL_thigh
        - RL_calf
        - RL_calflower
        - RL_calflower1
        - RL_foot
        - RR_hip
        - RR_thigh
        - RR_calf 
        - RR_calflower
        - RR_calflower1
        - RR_foot

      # Rays grazing the front-bottom edge of the body return mixed pixels that
      # form a streak under the belly (|y| < ~4 cm, down to ~20 cm below the body).
      # The box is extended downwards only, and its bottom stays ~9-17 cm above
      # the ground: on my_bag* this removes ~3/4 of the spurious cells under the
      # trunk, while a 10 cm step under the belly is still mapped correctly.
      base_link:
        box_padding: [0.0, 0.01, 0.12]

      # Calves: larger radial padding than the hips (default_cylinder_padding)
      FL_calf:
        cylinder_padding: [0.09, 0.025]
      FL_calflower:
        cylinder_padding: [0.09, 0.025]
      FL_calflower1:
        cylinder_padding: [0.09, 0.025]
      FR_calf:
        cylinder_padding: [0.09, 0.025]
      FR_calflower:
        cylinder_padding: [0.09, 0.025]
      FR_calflower1:
        cylinder_padding: [0.09, 0.025]
      RL_calf:
        cylinder_padding: [0.09, 0.025]
      RL_calflower:
        cylinder_padding: [0.09, 0.025]
      RL_calflower1:
        cylinder_padding: [0.09, 0.025]
      RR_calf:
        cylinder_padding: [0.09, 0.025]
      RR_calflower:
        cylinder_padding: [0.09, 0.025]
      RR_calflower1:
        cylinder_padding: [0.09, 0.025]
                                  